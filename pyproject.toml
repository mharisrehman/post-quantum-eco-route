[project]
name = "post-quantum-eco-route"
version = "0.1.0"
description = "Post-quantum secure edge-cloud waste monitoring simulation"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "psycopg[binary]>=3.2.0",
    "pqcrypto>=0.3.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
