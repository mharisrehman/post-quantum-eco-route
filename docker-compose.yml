services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eco_route
      POSTGRES_USER: eco_route
      POSTGRES_PASSWORD: eco_route
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://eco_route:eco_route@postgres:5432/eco_route
    ports:
      - "8000:8000"

volumes:
  postgres-data:
