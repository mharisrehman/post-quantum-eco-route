services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eco_route
      POSTGRES_USER: eco_route
      POSTGRES_PASSWORD: eco_route
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco_route -d eco_route"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eco_route:eco_route@postgres:5432/eco_route
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: .
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "uvicorn gateway:app --host 0.0.0.0 --port 8001",
      ]
    environment:
      CLOUD_API_URL: http://api:8000
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  simulator:
    build: .
    depends_on:
      gateway:
        condition: service_healthy
    command: ["python", "-m", "device.main"]
    environment:
      CLOUD_API_URL: http://gateway:8001
      DEVICE_INTERVAL_SECONDS: ${DEVICE_INTERVAL_SECONDS:-15}
      DEVICE_BIN_IDS: ${DEVICE_BIN_IDS:-bin-1,bin-2,bin-3}

volumes:
  postgres-data:
